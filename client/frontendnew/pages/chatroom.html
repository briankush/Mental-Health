<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chatroom | MindfulPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-base="../" data-page="chatroom"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
<main id="main-content" class="section" data-chat-root>
  <section class="container editorial-block"><span class="kicker">Chatroom</span><h1>Join a private conversation room.</h1><p>Enter the room ID shared by an administrator. Your room remains available here until you leave it.</p></section>
  <section class="container section--tight" data-room-gate>
    <form class="form-panel community-room-entry" data-room-entry>
      <h2>Enter a chatroom</h2><p class="meta">Use the room ID shared by the administrator.</p>
      <div class="form-actions"><input data-room-id-input type="text" placeholder="Paste room ID" aria-label="Chatroom ID" required><button class="btn" type="submit">Join room</button></div>
      <p class="form-help" data-room-entry-status role="status"></p>
    </form>
  </section>
  <section class="container section--tight chat-room-panel">
    <div class="chat-layout" data-hidden="true">
      <section class="chat-main" aria-label="Chat panel">
        <header class="chat-header"><span class="active-room-dot" aria-hidden="true"></span><strong data-room-name>Join a room to begin</strong><code class="active-room-id" data-room-id-display></code><span class="meta ml-1" data-online-count></span><span class="meta ml-1" data-typing-status></span><button class="btn btn--secondary" type="button" data-leave-room>Leave room</button></header>
        <div class="chat-messages" data-chat-messages></div>
        <form class="chat-input-wrap" data-chat-form><label for="chat-message">Message</label><div class="form-actions"><input id="chat-message" data-chat-input type="text" maxlength="1000" placeholder="Write a respectful message" aria-label="Chat message input"><button class="btn" type="submit">Send</button></div></form>
      </section>
    </div>
    <p class="meta mt-3" data-chat-status role="status"></p>
  </section>
</main>
<div id="site-footer"></div><script type="module" src="../js/app.js"></script></body></html>
