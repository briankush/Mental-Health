<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Community | MindfulPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-base="../" data-page="community"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
<main id="main-content" class="section" data-chat-root>
  <section class="container editorial-block"><span class="kicker">Community</span><h1>Join moderated conversation rooms.</h1><p>Choose a room, read ongoing threads, and share respectfully. Report options are available for safety and moderation.</p></section>
  <section class="container section--tight">
    <div class="chat-layout">
      <aside class="chat-rooms" aria-label="Rooms">
        <h3>Rooms</h3>
        <div class="room-item is-active" data-room="General Wellbeing" data-room-id="general">General Wellbeing</div>
        <div class="room-item" data-room="Stress Support" data-room-id="stress">Stress Support</div>
        <div class="room-item" data-room="Book Club" data-room-id="book-club">Book Club</div>
        <div class="room-item" data-room="Training Q&A" data-room-id="training">Training Q&A</div>
      </aside>
      <section class="chat-main" aria-label="Chat panel">
        <header class="chat-header"><strong data-room-name>General Wellbeing</strong> <span class="meta ml-1">● 24 online</span></header>
        <div class="chat-messages" data-chat-messages></div>
        <form class="chat-input-wrap" data-chat-form>
          <label for="chat-message">Message</label>
          <div class="form-actions">
            <input id="chat-message" data-chat-input type="text" maxlength="1000" placeholder="Write a respectful message" aria-label="Chat message input">
            <button class="btn" type="submit">Send</button>
          </div>
        </form>
      </section>
    </div>
    <p class="meta mt-3" data-chat-status role="status"></p>
  </section>
</main>
<div id="site-footer"></div><script type="module" src="../js/app.js"></script></body></html>
